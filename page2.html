<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Would You Go On A Date? ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="hearts"></div>

    <main class="container">

        <div class="date-heart">
            💗
        </div>

        <p class="tiny-text">
            I have one little question...
        </p>

        <h1 class="date-question">
            Would you like
            <br>
            to go on a date with me?
        </h1>

        <p class="date-message">
            Just you, me and a little bit of magic... ✨
        </p>

        <div class="date-buttons">

            <!-- YES DIRECTLY OPENS PAGE 3 -->
            <a
                href="page3.html"
                class="yes-button"
                id="yesButton"
            >
                YES ❤️
            </a>

            <!-- NO STILL RUNS AWAY -->
            <button
                class="no-button"
                id="noButton"
                onclick="runAway()"
            >
                NO 🙈
            </button>

        </div>

        <p
            class="date-hint"
            id="dateHint"
        >
            Be honest... 👀❤️
        </p>

    </main>

    <script src="script.js"></script>

</body>

</html>
